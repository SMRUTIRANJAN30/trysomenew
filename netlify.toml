[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_APP_URL = "https://trysomenew.com"
  NEXT_PUBLIC_API_URL = "https://api.trysomenew.com"
  NEXT_PUBLIC_WS_URL = "wss://api.trysomenew.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"

[[redirects]]
  from = "/api/v1/*"
  to = "https://api.trysomenew.com/api/v1/:splat"
  status = 200
  force = false
