[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_APP_URL = "https://trysomenew.com"
  NEXT_PUBLIC_API_URL = "https://api.trysomenew.com"
  NEXT_PUBLIC_WS_URL = "wss://api.trysomenew.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"

# High-speed static caching for Next.js immutable assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# API Reverse Proxy to FastAPI Backend
[[redirects]]
  from = "/api/v1/*"
  to = "https://api.trysomenew.com/api/v1/:splat"
  status = 200
  force = false
